<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário - Cafeteria Moka</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Cafeteria Moka ☕</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="cardápio.html">Cardápio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="contato.html">Contato</a>
            <a href="formulario.html">Formulário</a>
        </nav>

    </header>


    <main>

        <section class="formulario">

            <h2>Faça sua reserva 🌸</h2>

            <p>
                Preencha o formulário abaixo para entrar em contato
                com a Cafeteria Moka.
            </p>


            <form>

                <label for="nome">Nome:</label>

                <input 
                    type="text" 
                    id="nome" 
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >


                <label for="email">E-mail:</label>

                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="telefone">Telefone:</label>

                <input 
                    type="tel" 
                    id="telefone" 
                    name="telefone"
                    placeholder="(00) 00000-0000"
                >


                <label for="data">Data da reserva:</label>

                <input 
                    type="date" 
                    id="data" 
                    name="data"
                >


                <label for="pessoas">Quantidade de pessoas:</label>

                <select id="pessoas" name="pessoas">

                    <option value="">Selecione</option>

                    <option value="1">1 pessoa</option>

                    <option value="2">2 pessoas</option>

                    <option value="3">3 pessoas</option>

                    <option value="4">4 pessoas</option>

                    <option value="5">5 ou mais pessoas</option>

                </select>


                <label for="pedido">O que você gostaria de pedir?</label>

                <textarea
                    id="pedido"
                    name="pedido"
                    placeholder="Digite seu pedido ou observação..."
                    rows="5"
                ></textarea>


                <button type="submit">
                    Enviar formulário ☕
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Cafeteria Moka
        </p>

    </footer>

</body>

</html>
